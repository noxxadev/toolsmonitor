<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinerPlus Export Link Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .header p {
            color: #999;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .checkbox-list {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: #e8e8ff;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
            flex: 1;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .link-result {
            margin-top: 30px;
            display: none;
        }

        .link-result.show {
            display: block;
        }

        .result-box {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .result-link {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            color: #333;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .result-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-copy, .btn-open {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-copy {
            background: #52c41a;
            color: white;
        }

        .btn-copy:hover {
            background: #45a517;
        }

        .btn-open {
            background: #1890ff;
            color: white;
        }

        .btn-open:hover {
            background: #0050b3;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .message.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }

        .info-box {
            background: #e6f7ff;
            border-left: 4px solid #1890ff;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 12px;
            color: #0050b3;
            line-height: 1.6;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 MinerPlus Export</h1>
            <p>Generate Download Link Instantly</p>
        </div>

        <div class="form-group">
            <label>Select Strategy Codes *</label>
            <div class="checkbox-list">
                <div class="checkbox-item">
                    <input type="checkbox" id="code_offline" value="tag_offline">
                    <label for="code_offline">tag_offline</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_illegal" value="illegal_Sub-account&Pool">
                    <label for="code_illegal">illegal_Sub-account&Pool</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_not_restored" value="Not_Restored_for_Reboots">
                    <label for="code_not_restored">Not_Restored_for_Reboots</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_abnormal_mining" value="Abnormal_Mining_Software">
                    <label for="code_abnormal_mining">Abnormal_Mining_Software</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_zero_hashrate" value="Zero_Hashrate">
                    <label for="code_zero_hashrate">Zero_Hashrate</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_substandard" value="Substandard_Hashrate">
                    <label for="code_substandard">Substandard_Hashrate</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_dashboard_failed" value="Dashboard_Failed">
                    <label for="code_dashboard_failed">Dashboard_Failed</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_high_temp" value="High_Temperature">
                    <label for="code_high_temp">High_Temperature</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="code_abnormal_fan" value="Abnormal_Fan">
                    <label for="code_abnormal_fan">Abnormal_Fan</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="exportType">Export Type *</label>
            <select id="exportType">
                <option value="">-- Select Format --</option>
                <option value="excel">Excel (.xlsx)</option>
                <option value="csv">CSV (.csv)</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-generate" onclick="generateLink()">🔗 Generate Link</button>
        </div>

        <div id="messageBox" class="message"></div>

        <div id="linkResult" class="link-result">
            <div class="result-box">
                <div class="result-label">📥 Download Link:</div>
                <div class="result-link" id="linkDisplay"></div>
                <div class="result-buttons">
                    <button class="btn-copy" onclick="copyLink()">📋 Copy Link</button>
                    <button class="btn-open" onclick="openLink()">📥 Download Now</button>
                </div>
            </div>
        </div>

        <div class="info-box">
            <strong>💡 How to use:</strong>
            1. Select strategy codes<br>
            2. Choose format (Excel/CSV)<br>
            3. Click "Generate Link"<br>
            4. Copy or Download directly
        </div>
    </div>

    <script>
        let generatedUrl = '';

        function generateLink() {
            const selectedCodes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            const exportType = document.getElementById('exportType').value;
            const messageBox = document.getElementById('messageBox');

            // Validation
            if (selectedCodes.length === 0) {
                showMessage('Please select at least one Strategy Code', 'error');
                return;
            }

            if (!exportType) {
                showMessage('Please select Export Type', 'error');
                return;
            }

            // Build URL
            const baseUrl = 'https://user-0a7c37a74f87452a8f4554ddfa2ac48dobs.minerplus.com/webapi/1/al/alarm/exportRealtime';
            const params = new URLSearchParams();

            selectedCodes.forEach(code => params.append('strategyCodes[]', code));
            params.append('minerFarmId', '479279061059821444');
            params.append('minerFarmName', 'Karawang');
            params.append('type', exportType);

            generatedUrl = baseUrl + '?' + params.toString();

            // Display result
            document.getElementById('linkDisplay').textContent = generatedUrl;
            document.getElementById('linkResult').classList.add('show');
            showMessage('✓ Link generated successfully!', 'success');
        }

        function copyLink() {
            navigator.clipboard.writeText(generatedUrl).then(() => {
                showMessage('✓ Link copied to clipboard!', 'success');
            }).catch(() => {
                showMessage('✗ Failed to copy link', 'error');
            });
        }

        function openLink() {
            if (generatedUrl) {
                window.location.href = generatedUrl;
                showMessage('⏳ Download started...', 'success');
            }
        }

        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = `message show ${type}`;
            
            if (type === 'success') {
                setTimeout(() => messageBox.classList.remove('show'), 3000);
            }
        }
    </script>
</body>
</html>
