<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinerPlus Export Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        input, select {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .btn-export {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-export:active {
            transform: translateY(0);
        }
        .btn-export:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        .spinner-mini {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(12, 84, 96, 0.3);
            border-top-color: #0c5460;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .checkbox-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }
        .checkbox-item {
            margin-bottom: 8px;
        }
        .checkbox-item input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        .checkbox-item label {
            display: inline;
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
        }
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container-card">
        <div class="header">
            <h1>⚙️ MinerPlus Export Tool</h1>
            <p>Export Realtime Alarm Data to Excel/CSV</p>
            <div id="urlNotice" style="display: none; margin-top: 15px; padding: 10px; background: #cfe2ff; border: 1px solid #b6d4fe; border-radius: 6px; font-size: 12px; color: #084298;">
                ✓ Auto-detected from URL parameters
            </div>
        </div>

        <form id="exportForm">
            <div class="form-group">
                <label for="minerFarmId">Miner Farm ID</label>
                <input 
                    type="text" 
                    id="minerFarmId" 
                    name="minerFarmId" 
                    class="form-control"
                    value="479279061059821444"
                    readonly
                    style="background-color: #f8f9fa; cursor: not-allowed;"
                >
                <div class="info-text">✓ Auto-configured</div>
            </div>

            <div class="form-group">
                <label for="minerFarmName">Miner Farm Name</label>
                <input 
                    type="text" 
                    id="minerFarmName" 
                    name="minerFarmName" 
                    class="form-control"
                    value="Karawang"
                    readonly
                    style="background-color: #f8f9fa; cursor: not-allowed;"
                >
                <div class="info-text">✓ Auto-configured</div>
            </div>

            <div class="form-group">
                <label>Strategy Codes *</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_offline" name="strategyCodes" value="tag_offline">
                        <label for="strategy_offline">tag_offline</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_illegal" name="strategyCodes" value="illegal_Sub-account&Pool">
                        <label for="strategy_illegal">illegal_Sub-account&Pool</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_not_restored" name="strategyCodes" value="Not_Restored_for_Reboots">
                        <label for="strategy_not_restored">Not_Restored_for_Reboots</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_abnormal_mining" name="strategyCodes" value="Abnormal_Mining_Software">
                        <label for="strategy_abnormal_mining">Abnormal_Mining_Software</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_zero_hashrate" name="strategyCodes" value="Zero_Hashrate">
                        <label for="strategy_zero_hashrate">Zero_Hashrate</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_substandard" name="strategyCodes" value="Substandard_Hashrate">
                        <label for="strategy_substandard">Substandard_Hashrate</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_dashboard_failed" name="strategyCodes" value="Dashboard_Failed">
                        <label for="strategy_dashboard_failed">Dashboard_Failed</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_high_temp" name="strategyCodes" value="High_Temperature">
                        <label for="strategy_high_temp">High_Temperature</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="strategy_abnormal_fan" name="strategyCodes" value="Abnormal_Fan">
                        <label for="strategy_abnormal_fan">Abnormal_Fan</label>
                    </div>
                </div>
                <div class="info-text">Pilih minimal 1 strategy</div>
            </div>

            <div class="form-group">
                <label for="exportType">Export Type *</label>
                <select id="exportType" name="type" class="form-control" required>
                    <option value="">-- Select Format --</option>
                    <option value="excel">Excel (.xlsx)</option>
                    <option value="csv">CSV (.csv)</option>
                </select>
            </div>

            <button type="submit" class="btn-export">📥 Export Now</button>

            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('exportForm');
        const statusMessage = document.getElementById('statusMessage');
        const urlNotice = document.getElementById('urlNotice');

        // Auto-detect from URL parameters on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let autoDetected = false;

            if (urlParams.has('farmId')) {
                document.getElementById('minerFarmId').value = urlParams.get('farmId');
                autoDetected = true;
            }
            if (urlParams.has('farmName')) {
                document.getElementById('minerFarmName').value = urlParams.get('farmName');
                autoDetected = true;
            }

            if (autoDetected) {
                urlNotice.style.display = 'block';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate inputs
            const minerFarmId = document.getElementById('minerFarmId').value.trim();
            const minerFarmName = document.getElementById('minerFarmName').value.trim();
            const exportType = document.getElementById('exportType').value;
            
            const strategyCodes = Array.from(document.querySelectorAll('input[name="strategyCodes"]:checked'))
                .map(checkbox => checkbox.value);

            if (!minerFarmId) {
                showError('Please enter Miner Farm ID');
                return;
            }

            if (!minerFarmName) {
                showError('Please enter Miner Farm Name');
                return;
            }

            if (strategyCodes.length === 0) {
                showError('Please select at least one Strategy Code');
                return;
            }

            if (!exportType) {
                showError('Please select Export Type');
                return;
            }

            // Build URL
            const baseUrl = 'https://user-0a7c37a74f87452a8f4554ddfa2ac48dobs.minerplus.com/webapi/1/al/alarm/exportRealtime';
            const params = new URLSearchParams();
            
            strategyCodes.forEach(code => {
                params.append('strategyCodes[]', code);
            });
            params.append('minerFarmId', minerFarmId);
            params.append('minerFarmName', minerFarmName);
            params.append('type', exportType);

            const url = `${baseUrl}?${params.toString()}`;

            try {
                showLoading('Starting download...');
                
                // Use window.location to bypass CORS and trigger direct download
                window.location.href = url;
                
                // Show success message after a brief delay
                setTimeout(() => {
                    showSuccess('Download started! Check your downloads folder.');
                }, 1000);
                
            } catch (error) {
                console.error('Export Error:', error);
                showError(`Export failed: ${error.message}`);
            }
        });

        function showLoading(message) {
            statusMessage.className = 'status-message loading';
            statusMessage.innerHTML = `<span class="spinner-mini"></span>${message}`;
        }

        function showSuccess(message) {
            statusMessage.className = 'status-message success';
            statusMessage.textContent = '✓ ' + message;
        }

        function showError(message) {
            statusMessage.className = 'status-message error';
            statusMessage.textContent = '✗ ' + message;
        }
    </script>
</body>
</html>
